[project]
name = "datametronome"
version = "0.1.0"
description = "DataMetronome - Your Data Quality Maestro"
authors = [
    {name = "The Data Maestros", email = "team@datamaestros.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit>=3.4.0",
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datametronome"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.0.0",
    "asyncpg>=0.28.0",
    "redis>=4.5.0",
]
[tool.pytest.ini_options]
# One config for the pulse packages, which used to carry a pytest.ini each --
# and four of the five wrote [tool:pytest], a section name only valid in
# setup.cfg/tox.ini, so pytest silently ignored them. importlib import mode is
# what lets every package be collected in a single run; without it, same-named
# test modules across packages collide with ImportPathMismatchError.
addopts = "--import-mode=importlib --strict-markers"
asyncio_mode = "auto"
markers = ["unit: Unit tests", "integration: Integration tests", "slow: Slow running tests"]

[tool.ruff.lint]
# What the flake8 hook selected: syntax/name errors only. Style is ruff-format's
# job, and a POC does not need a lint backlog.
select = ["E9", "F63", "F7", "F82"]

[tool.ty.environment]
extra-paths = [
    "datametronome/pulse/core",
    "datametronome/pulse/bigquery",
    "datametronome/pulse/sqlite",
    "datametronome/pulse/postgres",
    "datametronome/pulse/postgres-psycopg3",
    "datametronome/podium"
]

[tool.ty.terminal]
output-format = "concise"

# ty exits non-zero on any diagnostic, warnings included, so every rule left
# enabled here is effectively a build gate.
[tool.ty.rules]
# Whether a suppression is "unused" depends on how the environment resolves
# third-party stubs, so these fire in one environment and are required in
# another. Acting on them breaks the build somewhere else.
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "ignore"
# Legacy "# type: ignore[rule]" comments whose rule names predate ty.
ignore-comment-unknown-rule = "ignore"
# Stdlib functions slated for removal in 3.16, mostly inside test fixtures.
deprecated = "ignore"
