[project]
name = "datametronome"
version = "0.1.0"
description = "DataMetronome - Your Data Quality Maestro"
authors = [
    {name = "The Data Maestros", email = "team@datamaestros.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit>=3.4.0",
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datametronome"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "httpx>=0.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.0.0",
    "asyncpg>=0.28.0",
    "redis>=4.5.0",
]
[tool.ty.environment]
extra-paths = [
    "datametronome/pulse/core",
    "datametronome/pulse/postgres-sqlalchemy",
    "datametronome/pulse/bigquery",
    "datametronome/pulse/sqlite",
    "datametronome/pulse/postgres",
    "datametronome/pulse/postgres-psycopg3",
    "datametronome/podium"
]

[tool.ty.terminal]
output-format = "concise"

# ty exits non-zero on any diagnostic, including warnings, so anything left
# enabled here is effectively a build failure. These three are noise rather
# than defects, and leaving them on means every upstream release can break CI.
[tool.ty.rules]
# Fires on stdlib functions slated for removal in Python 3.16, inside test
# fixtures we do not control the timing of.
deprecated = "ignore"
# Legacy "# type: ignore[rule]" comments whose rule names predate ty.
ignore-comment-unknown-rule = "ignore"
# Defensive checks that are provably dead given the annotations, but harmless.
redundant-condition = "ignore"
