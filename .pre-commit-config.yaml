repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  # ruff covers what black, isort and flake8 did between them, in one tool.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ui-nuxt-eslint
        name: ui-nuxt eslint
        entry: bash -lc "cd ui-nuxt && npm run -s lint:fix"
        language: system
        pass_filenames: false

      - id: ui-nuxt-prettier
        name: ui-nuxt prettier
        entry: bash -lc "cd ui-nuxt && npm run -s format"
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: ty-check
        name: ty type checking
        # Pinned to the same version CI installs. Unpinned, uvx resolves to
        # whatever is newest locally, and the two disagree about which rules
        # exist -- which is how a suppression for a rule the newer ty had
        # dropped got deleted as "phantom" and broke the build.
        entry: uvx ty@0.0.80 check
        language: system
        pass_filenames: false
        always_run: true
