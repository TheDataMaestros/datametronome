repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]
        args:
          - --count
          - --select=E9,F63,F7,F82
          - --show-source
          - --statistics

  - repo: local
    hooks:
      - id: ui-nuxt-eslint
        name: ui-nuxt eslint
        entry: bash -lc "cd ui-nuxt && npm run -s lint:fix"
        language: system
        pass_filenames: false

      - id: ui-nuxt-prettier
        name: ui-nuxt prettier
        entry: bash -lc "cd ui-nuxt && npm run -s format"
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: ty-check
        name: ty type checking
        entry: uvx ty check
        language: system
        pass_filenames: false
        always_run: true
