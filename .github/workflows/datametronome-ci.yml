name: DataMetronome CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-and-test:
    name: Quality, Types & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-timeout ty
          # Install core first for dependencies
          uv pip install -e ./datametronome/pulse/core
          uv pip install -e ./datametronome/pulse/sqlite
          uv pip install -e ./datametronome/pulse/postgres-psycopg3
          uv pip install -e ./datametronome/pulse/postgres-sqlalchemy
          uv pip install -e ./datametronome/pulse/postgres
          uv pip install -e ./datametronome/pulse/dbt
          uv pip install -e ./datametronome/brain/base
          uv pip install -e ./datametronome/podium
          # Install runtime deps not covered by -e
          uv pip install pydantic-settings python-jose[cryptography] passlib bcrypt==4.0.1 apscheduler redis asyncpg

      - name: Type check with ty
        run: uv run ty check --output-format github

      # Each suite is a separate invocation on purpose: the pulse packages each
      # ship their own tests/conftest.py with no package marker, so collecting
      # two of them in one pytest run raises ImportPathMismatchError.
      - name: Run Pulse Tests
        run: |
          uv run pytest datametronome/pulse/core/tests/ -v --timeout=60
          uv run pytest datametronome/pulse/postgres/tests/ -v --timeout=60
          uv run pytest datametronome/pulse/postgres-psycopg3/tests/ -v --timeout=60
          uv run pytest datametronome/pulse/postgres-sqlalchemy/tests/ -v --timeout=60
          uv run pytest datametronome/pulse/sqlite/tests/ -v --timeout=60
          uv run pytest datametronome/pulse/dbt/tests/ -v --timeout=60 --ignore=datametronome/pulse/dbt/tests/test_real_artifacts.py

      - name: Run Podium Tests
        run: uv run pytest datametronome/podium/tests/ -v --timeout=60

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-nuxt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui-nuxt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  release:
    name: Build & Release
    needs: [quality-and-test, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Only the pulse connector libraries are published. Podium is the
      # deployable app, not a library, so it is not pushed to PyPI.
      - name: Build pulse packages
        run: |
          mkdir -p dist
          for pkg in core postgres postgres-psycopg3 postgres-sqlalchemy sqlite bigquery dbt; do
            echo "::group::build $pkg"
            uv build "datametronome/pulse/$pkg" --out-dir dist
            echo "::endgroup::"
          done
          ls -l dist

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*
