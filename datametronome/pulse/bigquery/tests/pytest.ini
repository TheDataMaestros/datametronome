[pytest]
# Pytest configuration for BigQuery connector tests
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: Integration tests with real BigQuery (deselect with '-m "not integration"')
    bigquery: BigQuery-specific tests
    asyncio: Async tests
addopts =
    -v
    --strict-markers
    --tb=short
