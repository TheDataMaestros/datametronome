name: e-commerce
description: Online retail — orders, products, customers, payments

signatures:
  required: [orders, products, customers]
  optional: [carts, payments, categories, reviews, shipping, inventory, discounts]

metrics:
  - name: average_order_value
    query_hint: "AVG(total) FROM orders"
    typical_range: [20, 200]
  - name: cart_abandonment_rate
    typical_range: [0.60, 0.80]
  - name: customer_churn_rate_monthly
    typical_range: [0.03, 0.07]
  - name: payment_failure_rate
    typical_range: [0.02, 0.05]

patterns:
  - weekend_order_spike
  - holiday_seasonality
  - payment_failure_baseline
  - new_customer_acquisition_trend

suggested_checks:
  - type: freshness
    table: orders
    schedule: "0 * * * *"
    config:
      max_age_hours: 2
  - type: row_count_anomaly
    table: orders
    schedule: "0 0 * * *"
    config:
      threshold_std_devs: 3
  - type: column_values
    table: customers
    schedule: "0 6 * * *"
    config:
      column: email
      check: not_null_percentage
      threshold: 0.90

kpi_queries:
  average_order_value: |
    SELECT AVG(total_amount) as value
    FROM {schema}."orders"
    WHERE status = 'completed'
  monthly_revenue: |
    SELECT COALESCE(SUM(total_amount), 0) as value
    FROM {schema}."orders"
    WHERE date_trunc('month', created_at) = date_trunc('month', NOW())
  total_orders_this_month: |
    SELECT COUNT(*) as value
    FROM {schema}."orders"
    WHERE date_trunc('month', created_at) = date_trunc('month', NOW())
  new_customers_this_month: |
    SELECT COUNT(*) as value
    FROM {schema}."customers"
    WHERE date_trunc('month', created_at) = date_trunc('month', NOW())

performer_dimensions:
  - entity: product
    rank_query: |
      SELECT p.product_name as name,
             COALESCE(SUM(oi.price * oi.quantity), 0) as value,
             '$' as unit
      FROM {schema}."products" p
      JOIN {schema}."order_items" oi ON oi.product_id = p.id
      GROUP BY p.product_name
      ORDER BY value DESC
      LIMIT {limit}
    drill_query: |
      SELECT date_trunc('week', o.created_at)::date as period,
             COALESCE(SUM(oi.price * oi.quantity), 0) as revenue
      FROM {schema}."order_items" oi
      JOIN {schema}."orders" o ON o.id = oi.order_id
      JOIN {schema}."products" p ON p.id = oi.product_id
      WHERE p.product_name = '{entity_name}'
      GROUP BY period ORDER BY period DESC LIMIT 8
  - entity: category
    rank_query: |
      SELECT c.category_name as name,
             COALESCE(SUM(oi.price * oi.quantity), 0) as value,
             '$' as unit
      FROM {schema}."categories" c
      JOIN {schema}."products" p ON p.category_id = c.id
      JOIN {schema}."order_items" oi ON oi.product_id = p.id
      GROUP BY c.category_name
      ORDER BY value DESC
      LIMIT {limit}
    drill_query: |
      SELECT date_trunc('week', o.created_at)::date as period,
             COALESCE(SUM(oi.price * oi.quantity), 0) as revenue
      FROM {schema}."order_items" oi
      JOIN {schema}."orders" o ON o.id = oi.order_id
      JOIN {schema}."products" p ON p.id = oi.product_id
      JOIN {schema}."categories" c ON c.id = p.category_id
      WHERE c.category_name = '{entity_name}'
      GROUP BY period ORDER BY period DESC LIMIT 8
