name: crm
description: Marketing / CRM — contacts, campaigns, leads, deals

signatures:
  required: [contacts, campaigns, leads]
  optional: [deals, activities, segments, emails, tasks, notes]

metrics:
  - name: lead_conversion_rate
    typical_range: [0.01, 0.10]
  - name: pipeline_velocity_days
    typical_range: [7, 90]
  - name: email_open_rate
    typical_range: [0.15, 0.30]

patterns:
  - campaign_burst_activity
  - lead_decay_over_time
  - seasonal_engagement_shifts

suggested_checks:
  - type: freshness
    table: leads
    schedule: "0 0 * * *"
    config:
      max_age_hours: 48
  - type: column_values
    table: contacts
    schedule: "0 6 * * *"
    config:
      column: email
      check: not_null_percentage
      threshold: 0.85

kpi_queries:
  total_open_opportunities: |
    SELECT COUNT(*) as value
    FROM {schema}."opportunities"
    WHERE status = 'open'
  pipeline_value: |
    SELECT COALESCE(SUM(amount), 0) as value
    FROM {schema}."opportunities"
    WHERE status = 'open'
  won_this_month: |
    SELECT COUNT(*) as value
    FROM {schema}."opportunities"
    WHERE status = 'won'
      AND date_trunc('month', closed_at) = date_trunc('month', NOW())

performer_dimensions:
  - entity: salesperson
    rank_query: |
      SELECT owner_name as name,
             COALESCE(SUM(amount), 0) as value,
             '$' as unit
      FROM {schema}."opportunities"
      WHERE status = 'won'
        AND date_trunc('month', closed_at) = date_trunc('month', NOW())
      GROUP BY owner_name
      ORDER BY value DESC
      LIMIT {limit}
    drill_query: |
      SELECT date_trunc('month', closed_at)::date as period,
             COUNT(*) as deals_won,
             COALESCE(SUM(amount), 0) as revenue
      FROM {schema}."opportunities"
      WHERE owner_name = '{entity_name}' AND status = 'won'
      GROUP BY period ORDER BY period DESC LIMIT 6
