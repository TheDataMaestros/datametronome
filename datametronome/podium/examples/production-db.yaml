# Single Stave Configuration
# Example: One production database with its checks
#
# Import with:  python scripts/import_staves.py examples/production-db.yaml
#
# ${VAR} is read from the environment at import time. ${VAR:-default} falls
# back when the variable is unset.

staves:
  - id: stave-prod-001
    name: Production Database
    description: Main production PostgreSQL database
    data_source_type: postgres
    connection_config:
      host: ${DB_HOST}
      port: ${DB_PORT:-5432}
      database: ${DB_NAME}
      user: ${DB_USER}
      password: ${DB_PASSWORD}
      # RDS and Aurora with rds.force_ssl=1 reject plaintext connections.
      ssl: require
    is_active: true

clefs:
  - id: clef-prod-users-email-null
    stave_id: stave-prod-001
    name: User Email Check
    check_type: column_values
    config:
      table: users
      column: email
      condition: if_null
    fail: if_null > 0%
    schedule: "@hourly"
    is_active: true

  - id: clef-prod-users-age-range
    stave_id: stave-prod-001
    name: User Age Range
    check_type: column_values
    config:
      table: users
      column: age
      min: 0
      max: 150
    schedule: "@daily"
    is_active: true

  - id: clef-prod-users-volume
    stave_id: stave-prod-001
    name: Daily User Volume
    check_type: row_count
    config:
      table: users
    warn: "> 50000"
    fail: "< 1000"
    schedule: "0 8 * * *"
    is_active: true
