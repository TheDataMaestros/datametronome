# Streamlit UI Demo Configuration
# Designed to showcase all UI features and severity levels

staves:
  # Main demo database
  - id: stave-streamlit-demo
    name: Streamlit Demo Database
    description: Main database for Streamlit UI demonstrations
    data_source_type: postgres
    connection_config:
      host: ${DEMO_HOST:-localhost}
      port: ${DEMO_PORT:-5432}
      database: ${DEMO_DB:-streamlit_demo}
      user: ${DEMO_USER:-demo}
      password: ${DEMO_PASSWORD:-demo123}
    is_active: true

# Clefs designed to show different severity levels and check types
clefs:
  # Harmony (Pass) Examples
  - id: clef-harmony-row-count
    stave_id: stave-streamlit-demo
    name: ✅ Harmony - Healthy Row Count
    description: This check should always pass - shows Harmony status
    check_type: row_count
    config:
      table: users
    warn: "> 10000"  # Only warn if more than 10k users
    fail: "< 1000"   # Only fail if less than 1k users
    schedule: "@hourly"
    is_active: true
    
  # Dissonance (Warning) Examples
  - id: clef-dissonance-null-emails
    stave_id: stave-streamlit-demo
    name: ⚠️ Dissonance - Some NULL Emails
    description: This check shows Dissonance when some emails are NULL
    check_type: column_values
    config:
      table: users
      column: email
      condition: if_null
    warn: if_null > 2%   # Warn if more than 2% NULL
    fail: if_null > 10%  # Fail if more than 10% NULL
    schedule: "@hourly"
    is_active: true
    
  - id: clef-dissonance-freshness
    stave_id: stave-streamlit-demo
    name: ⚠️ Dissonance - Data Getting Stale
    description: Shows Dissonance when data is getting stale
    check_type: freshness
    config:
      table: orders
      column: created_at
      max_age: "1 hour"
    warn: "> 2 hours"    # Warn if older than 2 hours
    fail: "> 4 hours"    # Fail if older than 4 hours
    schedule: "@hourly"
    is_active: true
    
  # Cacophony (Failure) Examples
  - id: clef-cacophony-critical-nulls
    stave_id: stave-streamlit-demo
    name: ❌ Cacophony - Critical NULL Values
    description: This check fails when critical data is missing
    check_type: column_values
    config:
      table: orders
      column: customer_id
      condition: if_null
    fail: if_null > 0%   # Fail on any NULLs
    schedule: "@hourly"
    is_active: true
    
  - id: clef-cacophony-no-data
    stave_id: stave-streamlit-demo
    name: ❌ Cacophony - No Data Available
    description: Fails when no data is available
    check_type: row_count
    config:
      table: products
    fail: "< 1"          # Fail if no products
    schedule: "@hourly"
    is_active: true
    
  # Advanced Checks for UI Demonstration
  - id: clef-ml-anomaly-detection
    stave_id: stave-streamlit-demo
    name: 🤖 ML Anomaly Detection
    description: Demonstrates intelligent ML-based checks
    check_type: forecast
    config:
      metric: row_count
      table: daily_metrics
      strategy:
        model: sarima
        confidence: 95
    schedule: "@daily"
    is_active: true
    
  - id: clef-data-drift-detection
    stave_id: stave-streamlit-demo
    name: 📊 Data Drift Detection
    description: Shows data profile drift detection
    check_type: data_profile_drift
    config:
      table: user_behavior
      columns: ["session_duration", "page_views", "conversion_rate"]
      baseline_period: "7 days"
      drift_threshold: 0.1
    schedule: "@daily"
    is_active: true
    
  - id: clef-custom-python-check
    stave_id: stave-streamlit-demo
    name: 🐍 Custom Python Check
    description: Demonstrates custom Python validation
    check_type: python
    config:
      script_path: "demo_checks/custom_business_logic.py"
      parameters:
        max_discount: 50
        min_order_value: 10
    schedule: "@daily"
    is_active: true
