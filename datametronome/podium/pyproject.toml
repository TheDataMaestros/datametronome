[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datametronome-podium"
version = "0.1.0"
description = "Core backend API server for DataMetronome data observability platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "DataMetronome Team", email = "team@datametronome.dev" },
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "black>=23.0.0",
  "isort>=5.12.0",
  "flake8>=6.0.0",
]

[project.scripts]
datametronome-podium = "datametronome_podium.main:main"

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
