services:
  # PostgreSQL database for testing
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: datametronome_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./test_data:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d datametronome_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (cache + Celery result backend + RedBeat)
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Podium API
  podium:
    build:
      context: .
      dockerfile: datametronome/podium/Dockerfile
    env_file:
      - .env
    ports:
      - "8001:8001"
    environment:
      - DATAMETRONOME_SECRET_KEY=your-super-secret-key-that-is-at-least-32-characters-long
      - DATAMETRONOME_DATABASE_URL=postgresql://testuser:testpass@postgres:5432/datametronome_test
      - DATAMETRONOME_DEBUG=true
      - DATAMETRONOME_HOST=0.0.0.0
      - DATAMETRONOME_PORT=8001
      - DATAMETRONOME_ALLOWED_ORIGINS=http://localhost:3000
      # Ollama on host: use host.docker.internal (Mac/Windows). Override in .env if needed.
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      # Default to inline (no broker needed). Switch to celery when running with --profile worker.
      - DATAMETRONOME_DISPATCH_MODE=${DATAMETRONOME_DISPATCH_MODE:-inline}
      - DATAMETRONOME_CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DATAMETRONOME_CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATAMETRONOME_REDIS_URL=redis://redis:6379/0
      - DATAMETRONOME_AI_HEAVY_MODEL=${DATAMETRONOME_AI_HEAVY_MODEL:-gemini-2.5-pro}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      # Mount podium source for live reload (no rebuild needed when editing code)
      - ./datametronome/podium:/app/datametronome/podium
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery worker — executes checks
  podium-worker:
    build:
      context: .
      dockerfile: datametronome/podium/Dockerfile
    command: celery -A datametronome_podium.core.celery_app worker --loglevel=info -Q checks.high,checks.default,checks.bulk,intelligence.default
    env_file:
      - .env
    environment:
      - DATAMETRONOME_DATABASE_URL=postgresql://testuser:testpass@postgres:5432/datametronome_test
      - DATAMETRONOME_CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DATAMETRONOME_CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATAMETRONOME_REDIS_URL=redis://redis:6379/0
      - DATAMETRONOME_DISPATCH_MODE=celery
      - DATAMETRONOME_AI_HEAVY_MODEL=${DATAMETRONOME_AI_HEAVY_MODEL:-gemini-2.5-pro}
    volumes:
      - ./datametronome/podium:/app/datametronome/podium
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - worker

  # Celery Beat — schedules checks via RedBeat
  podium-beat:
    build:
      context: .
      dockerfile: datametronome/podium/Dockerfile
    command: celery -A datametronome_podium.core.celery_app beat --scheduler=redbeat.RedBeatScheduler --loglevel=info
    env_file:
      - .env
    environment:
      - DATAMETRONOME_DATABASE_URL=postgresql://testuser:testpass@postgres:5432/datametronome_test
      - DATAMETRONOME_CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DATAMETRONOME_CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATAMETRONOME_REDIS_URL=redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - worker

  # UI (optional - for full stack testing)
  ui:
    build:
      context: ./ui-nuxt
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8001/api/v1
      NUXT_PUBLIC_PODIUM_API_BASE: http://localhost:8001
    volumes:
      # Bind-mount source for live reload – edits on the host are picked up instantly
      - ./ui-nuxt:/app
      # Preserve the container's node_modules so they aren't hidden by the bind mount
      - /app/node_modules
    depends_on:
      podium:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
