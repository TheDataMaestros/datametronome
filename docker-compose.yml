version: '3.8'

services:
  # PostgreSQL database for testing
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: datametronome_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./test_data:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d datametronome_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Podium API
  podium:
    build:
      context: .
      dockerfile: datametronome/podium/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATAMETRONOME_SECRET_KEY=your-super-secret-key-that-is-at-least-32-characters-long
      - DATAMETRONOME_DATABASE_URL=sqlite:///./datametronome.db
      - DATAMETRONOME_DEBUG=true
      - DATAMETRONOME_HOST=0.0.0.0
      - DATAMETRONOME_PORT=8001
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
